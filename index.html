<style>

  }

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const Q = new URLSearchParams(location.search);
const CAPTURE = Q.has('capture');
if (CAPTURE) document.body.classList.add('capture');

const INK = 0x1f1d26, INK_CSS = '#1f1d26', RED_CSS = '#d8433b', PAPER_CSS = '#f7f2e7';
const PW = 1, PH = 1.36;          // one page, world units
const CW = 1024, CH = 1392;       // page canvas
const FLAT = 0.042;               // page height away from the spine

// ---------- helpers
const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
const easeOut = t => 1 - Math.pow(1 - t, 3);
const easeInOut = t => t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
const easeBack = t => { const c = 1.6; return 1 + (c + 1) * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2); };
function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function canvas(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; return [c, c.getContext('2d')]; }
function tex(c) { const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8; return t; }
function spacing(x, v) { if ('letterSpacing' in x) x.letterSpacing = v; }
function wrap(x, text, X, Y, maxW, lh) {
  let y = Y;
  for (const para of String(text).split('\n')) {
    let line = '';
    for (const w of para.split(' ')) {
      const test = line ? line + ' ' + w : w;
      if (x.measureText(test).width > maxW && line) { x.fillText(line, X, y); y += lh; line = w; }
      else line = test;
    }
    x.fillText(line, X, y); y += lh;
  }
  return y;
}
function fitFont(x, text, weight, size, family, maxW) {
  let s = size;
  do { x.font = `${weight} ${s}px ${family}`; s -= 4; } while (x.measureText(text).width > maxW && s > 20);
}

await Promise.all([
  '600 40px Caveat', '700 40px Caveat', '600 40px Fraunces', '800 40px Fraunces',
  '400 40px Inter', '600 40px Inter', '800 40px Inter', '600 40px "JetBrains Mono"', '800 40px "JetBrains Mono"',
].map(f => document.fonts.load(f).catch(() => null)));

// ---------- renderer / scene
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: CAPTURE });
renderer.setPixelRatio(CAPTURE ? 1 : Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.getElementById('stage').appendChild(renderer.domElement);
const MAXANISO = renderer.capabilities.getMaxAnisotropy();

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x121821);
scene.fog = new THREE.Fog(0x121821, 5, 11);

scene.add(new THREE.HemisphereLight(0xfff4e2, 0x26344a, 1.25));
const sun = new THREE.DirectionalLight(0xfff0d8, 2.4);
sun.position.set(-1.5, 3.4, 1.6);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -1.5, right: 1.5, top: 1.2, bottom: -1.2, near: 0.5, far: 8 });
sun.shadow.bias = -0.0003; sun.shadow.normalBias = 0.01; sun.shadow.radius = 5;
scene.add(sun);
const lamp = new THREE.PointLight(0xffc27a, 4, 7, 2);
lamp.position.set(1.6, 1.5, -1.0);
scene.add(lamp);

const camera = new THREE.PerspectiveCamera(32, innerWidth / innerHeight, 0.05, 40);
const TARGET = new THREE.Vector3(0, 0.05, 0.0);
function camBase() {
  const a = innerWidth / innerHeight;
  const D = (CAPTURE ? 2.8 : 2.65) * Math.max(1, 1.62 / a);
  return new THREE.Vector3(0, D * 0.77, D * 0.64).add(TARGET);
}
camera.position.copy(camBase());
camera.lookAt(TARGET);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.copy(TARGET);
controls.enableDamping = true; controls.enablePan = false;
controls.minDistance = 1.3; controls.maxDistance = 6;
controls.minPolarAngle = 0.15; controls.maxPolarAngle = 1.22;
controls.minAzimuthAngle = -0.9; controls.maxAzimuthAngle = 0.9;
controls.enabled = !CAPTURE;

addEventListener('resize', () => {
  renderer.setSize(innerWidth, innerHeight);
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  if (CAPTURE) camera.position.copy(camBase());
});

// ---------- table
{
  const [c, x] = canvas(1024, 1024);
  const g = x.createRadialGradient(512, 470, 60, 512, 512, 620);
  g.addColorStop(0, '#2c3a4f'); g.addColorStop(1, '#121821');
  x.fillStyle = g; x.fillRect(0, 0, 1024, 1024);
  const r = rng(7);
  for (let i = 0; i < 26000; i++) { x.fillStyle = `rgba(255,255,255,${r() * 0.035})`; x.fillRect(r() * 1024, r() * 1024, 1.5, 1.5); }
  const table = new THREE.Mesh(new THREE.PlaneGeometry(9, 9), new THREE.MeshStandardMaterial({ map: tex(c), roughness: 0.95 }));
  table.rotation.x = -Math.PI / 2; table.position.y = -0.036; table.receiveShadow = true;
  scene.add(table);
}

// ---------- book body
const coverMat = new THREE.MeshStandardMaterial({ color: 0x7d2320, roughness: 0.7 });
{
  const cover = new THREE.Mesh(new THREE.BoxGeometry(2.12, 0.016, 1.44), coverMat);
  cover.position.y = -0.026; cover.castShadow = cover.receiveShadow = true; scene.add(cover);
  const spine = new THREE.Mesh(new THREE.CylinderGeometry(0.03, 0.03, 1.44, 16, 1, false, Math.PI, Math.PI), coverMat);
  spine.rotation.x = Math.PI / 2; spine.position.set(0, -0.028, 0); scene.add(spine);
  const [c, x] = canvas(64, 256);
  x.fillStyle = '#efe8d8'; x.fillRect(0, 0, 64, 256);
  for (let i = 0; i < 256; i += 3) { x.fillStyle = 'rgba(120,100,70,0.18)'; x.fillRect(0, i, 64, 1); }
  const blockMat = new THREE.MeshStandardMaterial({ map: tex(c), roughness: 0.95 });
  for (const s of [-1, 1]) {
    const b = new THREE.Mesh(new THREE.BoxGeometry(PW - 0.02, 0.03, PH - 0.01), blockMat);
    b.position.set(s * (PW / 2 + 0.005), -0.004, 0); b.castShadow = b.receiveShadow = true; scene.add(b);
  }
}
const lift = d => 0.012 + (FLAT - 0.012) * (1 - Math.exp(-d / 0.055));
function pageGeo(side) {
  const g = new THREE.PlaneGeometry(PW, PH, 48, 1);
  g.rotateX(-Math.PI / 2);
  const p = g.attributes.position;
  for (let i = 0; i < p.count; i++) {
    const x = p.getX(i) + side * PW / 2;
    p.setX(i, x); p.setY(i, lift(Math.abs(x)));
  }
  g.computeVertexNormals();
  return g;
}
const leftPage = new THREE.Mesh(pageGeo(-1), new THREE.MeshStandardMaterial({ roughness: 0.95 }));
const rightPage = new THREE.Mesh(pageGeo(1), new THREE.MeshStandardMaterial({ roughness: 0.95 }));
leftPage.receiveShadow = rightPage.receiveShadow = true;
scene.add(leftPage, rightPage);

// ---------- paper canvases
function paper(side) {
  const [c, x] = canvas(CW, CH);
  x.fillStyle = PAPER_CSS; x.fillRect(0, 0, CW, CH);
  const r = rng(side === 'L' ? 11 : 12);
  for (let i = 0; i < 9000; i++) { x.fillStyle = `rgba(90,70,40,${r() * 0.05})`; x.fillRect(r() * CW, r() * CH, 1.5, 1.5); }
  const g = side === 'L' ? x.createLinearGradient(CW, 0, CW - 170, 0) : x.createLinearGradient(0, 0, 170, 0);
  g.addColorStop(0, 'rgba(80,60,30,0.22)'); g.addColorStop(1, 'rgba(80,60,30,0)');
  x.fillStyle = g; x.fillRect(0, 0, CW, CH);
  return [c, x];
}
const M = 92;                                    // page margin in canvas px
const FLAP = { x: M, y: 930, w: 430, h: 230 };   // sticky note slot on the left page; it flips over to the right
const STAMP = { x: 640, y: 1090, w: 300, h: 200 }; // stamp slot on the right page

function drawLeft(sp, n) {
  const [c, x] = paper('L');
  x.textBaseline = 'alphabetic';
  let y = 128;
  x.fillStyle = RED_CSS; x.font = '800 24px Inter'; spacing(x, '4px');
  x.fillText(sp.kicker.toUpperCase(), M, y); spacing(x, '0px');
  y += 92;
  x.fillStyle = INK_CSS; x.font = '800 80px Fraunces';
  y = wrap(x, sp.title, M, y, CW - 2 * M, 86);
  y += 6;
  x.fillStyle = '#34313b'; x.font = '400 30px Inter';
  y = wrap(x, sp.body, M, y, CW - 2 * M, 44);
  if (sp.contents) {
    y += 14; x.font = '600 30px Inter';
    sp.contents.forEach(([a, b], i) => {
      x.fillStyle = RED_CSS; x.fillText(String(i + 1), M, y);
      x.fillStyle = INK_CSS; x.fillText(a, M + 40, y);
      const w = x.measureText(b).width;
      x.fillStyle = '#8a8478'; x.fillText(b, CW - M - w, y);
      x.fillStyle = 'rgba(0,0,0,0.25)';
      const s = M + 50 + x.measureText(a).width;
      for (let d = s; d < CW - M - w - 14; d += 10) x.fillRect(d, y - 6, 3, 3);
      y += 46;
    });
  }
  if (sp.number) {
    y += 104;
    x.fillStyle = RED_CSS; fitFont(x, sp.number, 800, sp.numberSize || 128, sp.mono ? '"JetBrains Mono"' : 'Fraunces', CW - 2 * M);
    x.fillText(sp.number, M, y);
    y += 44; x.fillStyle = '#4d4955'; x.font = '600 28px Inter';
    y = wrap(x, sp.numberSub, M, y, CW - 2 * M, 38);
  }
  if (sp.note) { x.fillStyle = '#6b6774'; x.font = 'italic 400 25px Inter'; wrap(x, sp.note, M, y + 8, CW - 2 * M, 34); }
  // answer under the flap
  x.save();
  x.strokeStyle = 'rgba(31,29,38,0.35)'; x.setLineDash([10, 8]); x.lineWidth = 2;
  x.strokeRect(FLAP.x, FLAP.y, FLAP.w, FLAP.h); x.restore();
  x.fillStyle = RED_CSS; x.font = '800 22px Inter'; spacing(x, '3px');
  x.fillText('ANSWER', FLAP.x + 24, FLAP.y + 44); spacing(x, '0px');
  x.fillStyle = INK_CSS; x.font = '600 27px Inter';
  wrap(x, sp.a, FLAP.x + 24, FLAP.y + 84, FLAP.w - 48, 36);
  x.fillStyle = '#8a8478'; x.font = '400 19px Inter';
  wrap(x, sp.sources, M, CH - 118, CW - 2 * M, 26);
  x.fillStyle = '#8a8478'; x.font = '600 20px Inter'; x.textAlign = 'center';
  x.fillText(String(n * 2), CW / 2, CH - 42);
  return tex(c);
}
function drawRight(sp, n) {
  const [c, x] = paper('R');
  x.fillStyle = 'rgba(31,29,38,0.09)';
  for (let gx = M; gx <= CW - M; gx += 32) for (let gy = 80; gy <= CH - 200; gy += 32) x.fillRect(gx, gy, 2.4, 2.4);
  x.fillStyle = '#4d4955'; x.font = 'italic 600 30px Fraunces';
  x.fillText(sp.fig, M, CH - 120);
  x.fillStyle = '#8a8478'; x.font = '600 20px Inter'; x.textAlign = 'center';
  x.fillText(String(n * 2 + 1), CW / 2, CH - 42);
  return tex(c);
}

// ---------- materials & ink primitives
const mat = {
  paper: new THREE.MeshStandardMaterial({ color: 0xfbf8f1, roughness: 0.85 }),
  paper2: new THREE.MeshStandardMaterial({ color: 0xece4d3, roughness: 0.9 }),
  dark: new THREE.MeshStandardMaterial({ color: 0x34313d, roughness: 0.6 }),
  metal: new THREE.MeshStandardMaterial({ color: 0xc9c6c0, roughness: 0.35, metalness: 0.6 }),
  red: new THREE.MeshStandardMaterial({ color: 0xe0483f, roughness: 0.45, emissive: 0x7a120c, emissiveIntensity: 0.5 }),
  amber: new THREE.MeshStandardMaterial({ color: 0xf2a53a, roughness: 0.45, emissive: 0x6b3a00, emissiveIntensity: 0.35 }),
  green: new THREE.MeshStandardMaterial({ color: 0x3aa876, roughness: 0.5, emissive: 0x0d3d26, emissiveIntensity: 0.4 }),
  blue: new THREE.MeshStandardMaterial({ color: 0x4a82e0, roughness: 0.45, emissive: 0x0d2350, emissiveIntensity: 0.4 }),
  teal: new THREE.MeshStandardMaterial({ color: 0x2a9d8f, roughness: 0.45, emissive: 0x0a3833, emissiveIntensity: 0.4 }),
  board: new THREE.MeshStandardMaterial({ color: 0x2f8a55, roughness: 0.6 }),
  glass: new THREE.MeshStandardMaterial({ color: 0xbfe3ff, transparent: true, opacity: 0.35, roughness: 0.1 }),
  inkFlat: new THREE.MeshBasicMaterial({ color: INK }),
  ledG: new THREE.MeshBasicMaterial({ color: 0x46e08a }),
  ledR: new THREE.MeshBasicMaterial({ color: 0xff4a3d }),
};
const edgeMat = new THREE.LineBasicMaterial({ color: INK });
const hullMat = new THREE.ShaderMaterial({
  uniforms: { w: { value: 0.0024 } },
  vertexShader: `uniform float w;
    void main(){
      vec4 p = vec4(position + normal * w, 1.0);
      #ifdef USE_INSTANCING
        p = instanceMatrix * p;
      #endif
      gl_Position = projectionMatrix * modelViewMatrix * p;
    }`,
  fragmentShader: `void main(){ gl_FragColor = vec4(0.12, 0.11, 0.15, 1.0); }`,
  side: THREE.BackSide,
});
function ink(geo, m = mat.paper, { edges = true, hull = false, thr = 30 } = {}) {
  const o = new THREE.Mesh(geo, m);
  o.castShadow = true; o.receiveShadow = true;
  if (edges) o.add(new THREE.LineSegments(new THREE.EdgesGeometry(geo, thr), edgeMat));
  if (hull) o.add(new THREE.Mesh(geo, hullMat));
  return o;
}
const at = (o, x, y, z) => { o.position.set(x, y, z); return o; };
function G(...kids) { const g = new THREE.Group(); kids.forEach(k => g.add(k)); return g; }

function sprite(c, h) {
  const m = new THREE.SpriteMaterial({ map: tex(c), transparent: true, depthWrite: false, depthTest: false });
  const s = new THREE.Sprite(m);
  s.scale.set(h * c.width / c.height, h, 1);
  s.renderOrder = 20;
  return s;
}
function label(text, { h = 0.042, color = INK_CSS, font = '700 72px Caveat', bg = 'rgba(251,248,241,0.82)' } = {}) {
  const [, m] = canvas(8, 8); m.font = font;
  const w = Math.ceil(m.measureText(text).width) + 44;
  const [c, x] = canvas(w, 100);
  if (bg) { x.fillStyle = bg; x.beginPath(); x.roundRect(4, 10, w - 8, 80, 22); x.fill(); }
  x.font = font; x.fillStyle = color; x.textAlign = 'center'; x.textBaseline = 'middle';
  x.fillText(text, w / 2, 54);
  return sprite(c, h);
}
const glowTex = (() => {
  const [c, x] = canvas(64, 64);
  const g = x.createRadialGradient(32, 32, 0, 32, 32, 32);
  g.addColorStop(0, 'rgba(255,255,255,1)'); g.addColorStop(0.35, 'rgba(255,255,255,0.85)'); g.addColorStop(1, 'rgba(255,255,255,0)');
  x.fillStyle = g; x.fillRect(0, 0, 64, 64);
  return tex(c);
})();

// ---------- models
function key(m = mat.red, s = 1) {
  const g = new THREE.Group();
  const k = new THREE.Group();
  k.add(at(ink(new THREE.TorusGeometry(0.026, 0.009, 10, 28), m, { edges: false, hull: true }), 0, 0, 0));
  k.add(at(ink(new THREE.BoxGeometry(0.075, 0.012, 0.009), m), 0.064, 0, 0));
  k.add(at(ink(new THREE.BoxGeometry(0.01, 0.017, 0.009), m), 0.09, -0.013, 0));
  k.add(at(ink(new THREE.BoxGeometry(0.008, 0.012, 0.009), m), 0.073, -0.011, 0));
  k.position.set(-0.035, 0, 0);
  g.add(k); g.scale.setScalar(s);
  return g; // centred around the head-shaft middle
}
function standingKey(m, s) { const k = key(m, s); k.position.y = 0.04 * s; return G(k); }

function codeScreen(hl, sub = '') {

  for (let i = 0; i < 9; i++) {
    const y = 60 + i * 36;

      x.fillStyle = '#ff7b72'; x.font = '800 24px "JetBrains Mono"'; x.fillText(hl, 28, y + 19);

  return tex(c);
}

function flow(pts, { color = 0xe0483f, dots = 4, speed = 0.4, start = 0, carry = null, carryDur = 1.0, size = 0.04, line = true } = {}) {
  const curve = new THREE.CatmullRomCurve3(pts.map(p => new THREE.Vector3(...p)));
  const g = new THREE.Group();
  let ln = null;
  if (line) {
    ln = new THREE.Line(new THREE.BufferGeometry().setFromPoints(curve.getPoints(90)), new THREE.LineDashedMaterial({ color: INK, dashSize: 0.012, gapSize: 0.009, transparent: true, opacity: 0 }));
    ln.computeLineDistances(); g.add(ln);
  }
  const sp = [...Array(dots)].map(() => {
    const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: glowTex, color, transparent: true, depthWrite: false, opacity: 0 }));
    s.scale.setScalar(size); s.renderOrder = 4; g.add(s); return s;
  });
  if (carry) { carry.visible = false; g.add(carry); }
  return {
    obj: g, start,
    update(t, vis) {
      const lt = t - start;
      const v = vis * clamp(lt / 0.4);
      if (ln) ln.material.opacity = v * 0.75;
      sp.forEach((s, i) => {
        const u = ((Math.max(0, lt) * speed + i / dots) % 1);
        s.position.copy(curve.getPointAt(u));
        s.material.opacity = v * Math.sin(u * Math.PI);
      });
      if (carry) {
        const u = easeInOut(clamp(lt / carryDur));
        carry.visible = vis > 0.05 && lt > 0;
        carry.position.copy(curve.getPointAt(u));
        carry.scale.setScalar(Math.max(0.001, vis));
      }
    },
  };
}

    items: [lap, bigKey, ...cards], flows, extra: beamG,
    update(t, vis) {
      const p = clamp((t - 0.9) / 1.6);
      scr.set(Math.round(7477 * p), 8 * p, p >= 1);
      const bt = clamp((t - 0.9) / 1.6);
      beam.material.opacity = vis * 0.22 * Math.sin(bt * Math.PI);
      beam.position.set(0.5, 0.08, 0.15 - bt * 0.6);
      bigKey.children[0].rotation.y = Math.sin(t * 1.2) * 0.6;
      cards.forEach((c, i) => { c.userData.badge.visible = t > 2.4 + i * 0.13 + 0.6; });
    },
  };
}
function buildEnd() {
  const lock = padlock(mat.paper, 2.6); lock.position.set(0.5, 0, -0.05);
  const k = standingKey(mat.red, 1.6); k.position.set(0.24, 0, 0.18);
  const lap = laptop(0.18, codeScreen('keyaudit: 0 new keys', 'daily check')); lap.position.set(0.8, 0, 0.2); lap.rotation.y = -0.4;
  const done = label('✓ locked', { h: 0.06, color: '#ffffff', bg: '#2f9e6b', font: '800 56px Inter' }); done.position.set(0.5, 0.33, -0.05);
  const w0 = done.scale.x, h0 = done.scale.y;
  return {
    items: [lock, k, lap], flows: [], extra: G(done),
    update(t, vis) {
      lock.userData.setOpen(1 - easeOut(clamp((t - 1.3) / 0.35)));
      const p = clamp((t - 1.7) / 0.3);
      done.material.opacity = p * vis; done.scale.set(w0 * (0.5 + 0.5 * easeBack(p)), h0 * (0.5 + 0.5 * easeBack(p)), 1);
      k.children[0].rotation.y = Math.sin(t) * 0.5;
    },
  };
}

// ---------- flap & stamp (left page)
const toWorldL = (px, py) => new THREE.Vector3(-PW + px / CW * PW, 0, -PH / 2 + py / CH * PH);
function makeFlap(sp) {
  const [c, x] = canvas(430, 230);
  x.fillStyle = '#f6d55c'; x.fillRect(0, 0, 430, 230);
  x.fillStyle = 'rgba(255,255,255,0.45)'; x.fillRect(130, 0, 170, 22);
  x.fillStyle = 'rgba(31,29,38,0.6)'; x.font = '800 18px Inter'; spacing(x, '3px'); x.fillText('LIFT THE FLAP  ↑', 24, 54); spacing(x, '0px');
  x.fillStyle = INK_CSS; x.font = '700 50px Caveat';
  wrap(x, sp.q, 24, 120, 380, 52);
  const w = FLAP.w / CW * PW, h = FLAP.h / CH * PH;
  const front = new THREE.Mesh(new THREE.PlaneGeometry(w, h), new THREE.MeshStandardMaterial({ map: tex(c), roughness: 0.9 }));
  const back = new THREE.Mesh(new THREE.PlaneGeometry(w, h), new THREE.MeshStandardMaterial({ color: 0xe6c64e, roughness: 0.9, side: THREE.BackSide }));
  [front, back].forEach(m => { m.rotation.x = -Math.PI / 2; m.position.x = -w / 2; m.castShadow = true; });
  const hinge = G(front, back);
  const p = toWorldL(FLAP.x + FLAP.w, FLAP.y + FLAP.h / 2);
  hinge.position.set(p.x, FLAT + 0.003, p.z);
  hinge.userData.hit = front;
  return hinge;
}
function makeStamp(text) {
  const [c, x] = canvas(560, 300);
  x.strokeStyle = RED_CSS; x.fillStyle = RED_CSS; x.lineWidth = 12;
  x.beginPath(); x.roundRect(16, 16, 528, 268, 26); x.stroke();
  x.lineWidth = 4; x.beginPath(); x.roundRect(36, 36, 488, 228, 16); x.stroke();
  fitFont(x, text, 800, 64, 'Inter', 440); x.textAlign = 'center'; x.textBaseline = 'middle';
  spacing(x, '2px'); x.fillText(text, 280, 156);
  const r = rng(text.length * 7);
  x.globalCompositeOperation = 'destination-out';
  for (let i = 0; i < 900; i++) { x.fillStyle = `rgba(0,0,0,${0.3 + r() * 0.7})`; x.fillRect(r() * 560, r() * 300, 1 + r() * 4, 1 + r() * 3); }
  const w = STAMP.w / CW * PW, h = w * 300 / 560;
  const m = new THREE.Mesh(new THREE.PlaneGeometry(w, h), new THREE.MeshBasicMaterial({ map: tex(c), transparent: true, opacity: 0, depthWrite: false, polygonOffset: true, polygonOffsetFactor: -4 }));
  m.rotation.x = -Math.PI / 2;
  const g = G(m);
  const p = new THREE.Vector3((STAMP.x + STAMP.w / 2) / CW * PW, 0, -PH / 2 + (STAMP.y + STAMP.h / 2) / CH * PH);
  g.position.set(p.x, FLAT + 0.0015, p.z); g.rotation.y = 0.14;
  g.userData.m = m;
  return g;
}

// ---------- instantiate spreads
const ROOT = new THREE.Group(); ROOT.position.y = FLAT; scene.add(ROOT);
const texCache = {};
const pageTex = (i, s) => texCache[i + s] ||= (s === 'L' ? drawLeft(SPREADS[i], i) : drawRight(SPREADS[i], i));
SPREADS.forEach((sp, i) => {
  const b = sp.build();
  const g = new THREE.Group();
  b.items.forEach(o => g.add(o));
  b.flows.forEach(f => g.add(f.obj));
  if (b.extra) g.add(b.extra);
  b.init?.();
  ROOT.add(g);
  const flap = makeFlap(sp), stamp = makeStamp(sp.stamp);
  scene.add(flap, stamp);
  Object.assign(sp, { b, g, flap, stamp, t: 0, fold: 1, lifted: false, flapA: 0, liftT: null });
  g.visible = false; flap.visible = false; stamp.visible = false;
});
function animSpread(sp, dt) {
  const t = sp.t;
  const n = sp.b.items.length;
  sp.b.items.forEach((o, i) => {
    const p = Math.min(clamp((t - 0.15 - i * 0.13) / 0.6), sp.fold);
    o.visible = p > 0.002;
    const e = easeBack(p);
    o.userData.s0 ??= o.scale.x * (sp.k || 1.28);
    o.scale.setScalar(o.userData.s0 * Math.max(0.001, 0.35 + 0.65 * e));
    o.rotation.z = (1 - easeOut(p)) * 1.45;
  });
  const vis = sp.fold * clamp((t - 0.3 - n * 0.13) / 0.3);
  sp.b.flows.forEach(f => f.update(t, vis));
  sp.b.update?.(t, sp.fold);
  // flap & stamp
  const target = sp.lifted ? 1 : 0;
  sp.flapA += (target - sp.flapA) * (1 - Math.exp(-dt * 9));
  sp.flap.rotation.z = -sp.flapA * 2.96;
  const sm = sp.stamp.userData.m;
  if (sp.liftT !== null) {
    const p = clamp((t - sp.liftT - 0.35) / 0.22);
    sm.material.opacity = 0.9 * p * sp.fold;
    sp.stamp.scale.setScalar(1 + (1 - easeOut(p)) * 1.2);
  } else { sm.material.opacity = 0; }
}
function liftFlap(sp) { if (!sp.lifted) { sp.lifted = true; sp.liftT = sp.t; } else { sp.lifted = false; } }
function resetSpread(sp) { sp.t = 0; sp.fold = 1; sp.lifted = false; sp.flapA = 0; sp.liftT = null; }

// ---------- page turning sheet
const N = 36;
const sheetGeo = new THREE.PlaneGeometry(PW, PH, N, 1); sheetGeo.rotateX(-Math.PI / 2);
const sheetF = new THREE.Mesh(sheetGeo, new THREE.MeshStandardMaterial({ roughness: 0.95, side: THREE.FrontSide }));
const sheetB = new THREE.Mesh(sheetGeo, new THREE.MeshStandardMaterial({ roughness: 0.95, side: THREE.BackSide }));
sheetF.castShadow = sheetB.castShadow = true;
const sheet = G(sheetF, sheetB); sheet.visible = false; scene.add(sheet);
function mirrored(t) { const m = t.clone(); m.wrapS = THREE.RepeatWrapping; m.repeat.x = -1; m.offset.x = 1; m.needsUpdate = true; return m; }
const mirrorCache = new Map();
function poseSheet(theta, dir) {
  const pos = sheetGeo.attributes.position;
  const k = 0.85 * Math.sin(theta) * (dir > 0 ? -1 : 1);
  const ds = PW / N;
  let x = 0, y = 0; const xs = [0], ys = [0];
  for (let i = 1; i <= N; i++) { const s = (i - 0.5) / N; const a = theta + k * s; x += Math.cos(a) * ds; y += Math.sin(a) * ds; xs.push(x); ys.push(y); }
  const flat = Math.abs(Math.cos(theta)) ** 6;
  for (let r = 0; r < 2; r++) for (let i = 0; i <= N; i++) {
    const idx = r * (N + 1) + i;
    pos.setX(idx, xs[i]);
    pos.setY(idx, ys[i] + FLAT + 0.0025 + 0.01 * Math.sin(theta) + (lift(Math.abs(xs[i])) - FLAT) * flat);
  }
  pos.needsUpdate = true; sheetGeo.computeVertexNormals();
}

// ---------- navigation state
let cur = 0, flip = null;
const label$ = document.getElementById('label');
function setStatic(li, ri) { leftPage.material.map = pageTex(li, 'L'); rightPage.material.map = pageTex(ri, 'R'); leftPage.material.needsUpdate = rightPage.material.needsUpdate = true; }
function showSpread(i, { left = true, right = true } = {}) {
  const sp = SPREADS[i];
  if (right) { sp.g.visible = true; sp.stamp.visible = true; }
  if (left) sp.flap.visible = true;
}
function hideSpread(i, { left = true, right = true } = {}) {
  const sp = SPREADS[i];
  if (right) { sp.g.visible = false; sp.stamp.visible = false; }
  if (left) sp.flap.visible = false;
}
function updateUI() {
  const sp = SPREADS[cur];
  label$.innerHTML = `<b>${cur || '·'}</b>${sp.nav}`;
  document.getElementById('prev').disabled = cur === 0;
  document.getElementById('next').disabled = cur === SPREADS.length - 1;
}
function go(dir) {
  if (flip) return;
  const to = cur + dir;
  if (to < 0 || to >= SPREADS.length) return;
  flip = { dir, to, t: 0, phase: 'fold' };
  SPREADS[cur].lifted = false;
  playSfx('flip');
}
function goTo(i) { if (i !== cur) go(i > cur ? 1 : -1), pendingTarget = i; }
let pendingTarget = null;

function stepFlip(dt) {
  const from = SPREADS[cur], to = SPREADS[flip.to];
  flip.t += dt;
  if (flip.phase === 'fold') {
    from.fold = Math.max(0, 1 - flip.t / 0.32);
    if (flip.t >= 0.32) {
      flip.phase = 'turn'; flip.t = 0;
      hideSpread(cur, { left: false });
      resetSpread(to); to.fold = 1;
      const fT = flip.dir > 0 ? pageTex(cur, 'R') : pageTex(flip.to, 'R');
      const bT = flip.dir > 0 ? pageTex(flip.to, 'L') : pageTex(cur, 'L');
      if (!mirrorCache.has(bT)) mirrorCache.set(bT, mirrored(bT));
      sheetF.material.map = fT; sheetB.material.map = mirrorCache.get(bT);
      sheetF.material.needsUpdate = sheetB.material.needsUpdate = true;
      if (flip.dir > 0) setStatic(cur, flip.to);
      else { setStatic(flip.to, cur); hideSpread(cur, { right: false }); showSpread(flip.to, { right: false }); }
      sheet.visible = true;
    }
  }
  if (flip.phase === 'turn') {
    const p = easeInOut(clamp(flip.t / 0.95));
    poseSheet(flip.dir > 0 ? p * Math.PI : (1 - p) * Math.PI, flip.dir);
    if (flip.t >= 0.95) {
      sheet.visible = false;
      setStatic(flip.to, flip.to);
      if (flip.dir > 0) { hideSpread(cur, { right: false }); showSpread(flip.to, { right: false }); }
      showSpread(flip.to, { left: false });
      cur = flip.to; flip = null;
      updateUI(); playSfx('pop');
      if (pendingTarget !== null && pendingTarget !== cur) go(pendingTarget > cur ? 1 : -1); else pendingTarget = null;
    }
  }
}

// ---------- sound (tiny, synthesized; interactive mode only)
let actx = null;
function playSfx(kind) {
  if (CAPTURE || !actx) return;
  const t = actx.currentTime;
  if (kind === 'flip') {
    const len = 0.35, buf = actx.createBuffer(1, actx.sampleRate * len, actx.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * Math.sin(Math.PI * i / d.length) * 0.35;
    const s = actx.createBufferSource(); s.buffer = buf;
    const f = actx.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = 1800; f.Q.value = 0.6;
    s.connect(f).connect(actx.destination); s.start(t);
  } else {
    const o = actx.createOscillator(), g = actx.createGain();
    o.frequency.setValueAtTime(kind === 'stamp' ? 120 : 520, t); o.frequency.exponentialRampToValueAtTime(kind === 'stamp' ? 60 : 900, t + 0.12);
    g.gain.setValueAtTime(0.12, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.18);
    o.connect(g).connect(actx.destination); o.start(t); o.stop(t + 0.2);
  }
}

// ---------- input
const ray = new THREE.Raycaster(), ptr = new THREE.Vector2();
let downAt = null;
function pick(e) {
  ptr.set(e.clientX / innerWidth * 2 - 1, -e.clientY / innerHeight * 2 + 1);
  ray.setFromCamera(ptr, camera);
}
renderer.domElement.addEventListener('pointerdown', e => { downAt = [e.clientX, e.clientY]; actx ||= new (window.AudioContext || window.webkitAudioContext)(); });
renderer.domElement.addEventListener('pointermove', e => {
  if (flip) return;
  pick(e);
  const hit = ray.intersectObject(SPREADS[cur].flap.userData.hit, false).length;
  renderer.domElement.style.cursor = hit ? 'pointer' : '';
});
renderer.domElement.addEventListener('pointerup', e => {
  if (!downAt || Math.hypot(e.clientX - downAt[0], e.clientY - downAt[1]) > 6 || flip) return;
  pick(e);
  const sp = SPREADS[cur];
  if (ray.intersectObject(sp.flap.userData.hit, false).length) { liftFlap(sp); if (sp.lifted) setTimeout(() => playSfx('stamp'), 350); return; }
  const r = ray.intersectObject(rightPage, false)[0];
  if (r && r.uv.x > 0.8) return go(1);
  const l = ray.intersectObject(leftPage, false)[0];
  if (l && l.uv.x < 0.2) return go(-1);
});
addEventListener('keydown', e => {
  if (e.key === 'ArrowRight' || e.key === ' ') go(1);
  if (e.key === 'ArrowLeft') go(-1);
});
document.getElementById('prev').onclick = () => go(-1);
document.getElementById('next').onclick = () => go(1);
const toc = document.getElementById('toc');
toc.innerHTML = SPREADS.map((s, i) => `<button data-i="${i}"><span>${i || '·'}</span>${s.nav}</button>`).join('');
toc.onclick = e => { const b = e.target.closest('button'); if (b) { toc.hidden = true; goTo(+b.dataset.i); } };
document.getElementById('menuBtn').onclick = () => { toc.hidden = !toc.hidden; };

// ---------- capture timeline (deterministic, driven by window.__frame)
const hook = document.getElementById('hook'), capline = document.getElementById('capline');
hook.querySelector('.big').innerHTML = Q.get('h1') || '6 real security leaks.<br><em>One 3D pop-up book.</em>';
hook.querySelector('.small').textContent = Q.get('h2') || 'Toyota · Uber · SolarWinds · OpenCode · Tailscale · my own Mac';
const CAP = { first: 2.4, per: 5.5, flapAt: 1.6 };
let capNextAt = CAP.first, capLastCap = -1;
function captureTick(T) {
  hook.style.opacity = T < 2.3 ? 1 : clamp(1 - (T - 2.3) / 0.4);
  if (!flip && T >= capNextAt && cur < SPREADS.length - 1) { go(1); capNextAt += CAP.per; }
  const sp = SPREADS[cur];
  if (!flip && cur > 0 && sp.t > CAP.flapAt && !sp.lifted && sp.liftT === null) liftFlap(sp);
  const want = flip ? -1 : cur;
  if (want !== capLastCap) {
    capLastCap = want;
    const c = want >= 1 ? SPREADS[want].cap : null;
    capline.style.opacity = c ? 1 : 0;
    if (c) capline.innerHTML = want === SPREADS.length - 1 && Q.get('endcap') ? Q.get('endcap') : `<span>${want <= 6 ? want + ' · ' : ''}${c[0]}</span> · ${c[1]}`;
  }
  const base = camBase();
  camera.position.set(base.x + Math.sin(T * 0.35) * 0.05, base.y - 0.04 * Math.sin(T * 0.2), base.z - 0.06 + Math.cos(T * 0.3) * 0.04);
  camera.lookAt(TARGET.x + 0.015 * Math.sin(T * 0.25), TARGET.y, TARGET.z);
}

// ---------- loop
let T = 0;
function frame(dt) {
  T += dt;
  if (CAPTURE) captureTick(T);
  if (flip) stepFlip(dt);
  for (const [i, sp] of SPREADS.entries()) {
    if (!sp.g.visible && !sp.flap.visible) continue;
    if (i === cur && !flip) sp.t += dt;
    else if (i === cur && flip?.phase === 'fold') sp.t += dt;
    animSpread(sp, dt);
  }
  if (!CAPTURE) controls.update();
  renderer.render(scene, camera);
}
setStatic(0, 0); showSpread(0); updateUI();
if (CAPTURE) SPREADS[0].t = 1.6;
const clock = new THREE.Clock();
window.__frame = (dt = 1 / 30) => frame(dt);
window.__ready = true;
window.__dbg = { SPREADS, scene, camera, go, get cur() { return cur; } };
document.getElementById('loader').style.opacity = 0;
setTimeout(() => document.getElementById('loader').remove(), 700);
if (!CAPTURE) {
  renderer.setAnimationLoop(() => frame(Math.min(0.05, clock.getDelta())));
  setTimeout(() => { document.getElementById('hint').style.opacity = 0; }, 9000);
} else frame(0);
</script>
